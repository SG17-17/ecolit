on:
  push:
    branches: main
  schedule:
    - cron: '0 0 * * *' # Setiap jam 12 malam otomatis jalan
  workflow_dispatch: # Supaya bisa di klik run manual dari web GitHub

name: Render and Publish Quarto

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Ubuntu System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk-dev

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "quarto", "lavaan", "semTools", "semPlot", "googlesheets4", "dplyr", "psych", "knitr"))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

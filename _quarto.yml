project:
  type: book
  output-dir: _book
  pre-render: "Rscript R/setup_data.R"

book:
  title: "Data Analysis — Measurement Model Testing (CFA)"
  subtitle: "Construct Validity and Reliability"
  author: "Muhammad Niam Makhali"
  date: today
  page-footer:
    left: "© 2026 Muhammad Niam Makhali"
    right: "Environmental Psychology Research"
  chapters:
    - index.qmd
    - 02_eid.qmd
    - 03_esi.qmd
    - 04_psmls.qmd
    - 05_peb.qmd
    - 06_pwb.qmd
    - 07_summary.qmd

format:
  html:
    fontsize: 11pt
    grid:
      body-width: 1500px
      sidebar-width: 250px
      margin-width: 250px
    theme:
      light:
        - cosmo
        - custom.scss
      dark: darkly
    toc: true
    toc-depth: 3
    toc-title: "Table of Contents"
    number-sections: false
    code-fold: true
    code-tools: true
    code-summary: "Show code"
    df-print: kable
    fig-dpi: 300

execute:
  warning: false
  message: false
